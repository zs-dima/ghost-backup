name: publish

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKERHUB_REGISTRY: docker.io
  DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE || 'zsdima/ghost-backup' }}

jobs:
  prepare:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      images: ${{ steps.meta-inputs.outputs.images }}
      tags: ${{ steps.tags-final.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - name: Verify DockerHub credentials
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKERHUB_USERNAME:-}" ] || [ -z "${DOCKERHUB_TOKEN:-}" ]; then
            echo "::error::DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are required."
            exit 1
          fi

      - name: Prepare image list
        id: meta-inputs
        shell: bash
        run: |
          set -euo pipefail
          images="${REGISTRY}/${IMAGE_NAME}"
          images="${images}"$'\n'"${DOCKERHUB_REGISTRY}/${DOCKERHUB_IMAGE}"
          {
            echo "images<<EOF"
            echo "$images"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.meta-inputs.outputs.images }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Finalize image tags
        id: tags-final
        shell: bash
        env:
          IMAGES: ${{ steps.meta-inputs.outputs.images }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          if [ -z "$IMAGES" ]; then
            echo "::error::No image names produced; check meta-inputs step."
            exit 1
          fi
          ref="${GITHUB_REF:-}"
          tag_name=""
          if [[ "$ref" == refs/tags/* ]]; then
            tag_name="${ref#refs/tags/}"
          fi
          short_sha="${GITHUB_SHA:0:7}"
          declare -A seen
          out_tags=""
          add_tag() {
            local t="$1"
            if [ -n "$t" ] && [ -z "${seen[$t]:-}" ]; then
              out_tags+="${t}"$'\n'
              seen["$t"]=1
            fi
          }
          while IFS= read -r tag; do
            add_tag "$tag"
          done <<< "$TAGS"
          if [ -n "$tag_name" ]; then
            while IFS= read -r image; do
              [ -z "$image" ] && continue
              add_tag "${image}:${tag_name}"
            done <<< "$IMAGES"
          fi
          while IFS= read -r image; do
            [ -z "$image" ] && continue
            add_tag "${image}:latest"
            add_tag "${image}:sha-${short_sha}"
          done <<< "$IMAGES"
          if [ -z "$out_tags" ]; then
            echo "::error::No image tags produced; check docker/metadata-action outputs."
            exit 1
          fi
          {
            echo "tags<<EOF"
            printf '%s' "$out_tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    permissions:
      actions: write
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    needs: prepare
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare staging tags
        id: staging-tags
        shell: bash
        run: |
          set -euo pipefail
          suffix="-${{ matrix.arch }}-staging-${GITHUB_RUN_ID}"
          tags="${{ needs.prepare.outputs.tags }}"
          images="${{ needs.prepare.outputs.images }}"
          if [ -z "$images" ]; then
            images="${REGISTRY}/${IMAGE_NAME}"
            images="${images}"$'\n'"${DOCKERHUB_REGISTRY}/${DOCKERHUB_IMAGE}"
          fi
          declare -A seen
          base_tags=""
          add_base() {
            local t="$1"
            if [ -n "$t" ] && [ -z "${seen[$t]:-}" ]; then
              base_tags+="${t}"$'\n'
              seen["$t"]=1
            fi
          }
          while IFS= read -r tag; do
            add_base "$tag"
          done <<< "$tags"
          while IFS= read -r image; do
            [ -z "$image" ] && continue
            add_base "${image}:latest"
          done <<< "$images"
          if [ -z "$base_tags" ]; then
            echo "::error::No base tags produced; check prepare outputs."
            exit 1
          fi
          out_tags=""
          while IFS= read -r base; do
            [ -z "$base" ] && continue
            out_tags+="${base}${suffix}"$'\n'
          done <<< "$base_tags"
          if [ -z "$out_tags" ]; then
            echo "::error::No image tags produced; check docker/metadata-action outputs."
            exit 1
          fi
          {
            echo "tags<<EOF"
            printf '%s' "$out_tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push staging image (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: ./deploy
          file: ./deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          pull: true
          push: true
          sbom: true
          provenance: true
          tags: ${{ steps.staging-tags.outputs.tags }}
          labels: ${{ needs.prepare.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      - name: Select smoke tag
        id: smoke-tag
        shell: bash
        run: |
          set -euo pipefail
          tags="${{ steps.staging-tags.outputs.tags }}"
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            echo "image=$tag" >> "$GITHUB_OUTPUT"
            break
          done <<< "$tags"

      - name: Smoke test image (${{ matrix.arch }})
        shell: bash
        run: |
          set -euo pipefail
          image="${{ steps.smoke-tag.outputs.image }}"
          docker pull "$image"
          docker run --rm --entrypoint /bin/sh "$image" -c '
            set -e
            test -x /usr/local/bin/backup
            restic version >/dev/null
            mariadb-admin --version >/dev/null
            if [ -x /usr/bin/mariadb-dump ]; then
              /usr/bin/mariadb-dump --version >/dev/null
            else
              /usr/bin/mysqldump --version >/dev/null
            fi
            gzip --version >/dev/null
          '

  manifest:
    permissions:
      packages: write
    runs-on: ubuntu-24.04
    needs: [prepare, build]
    timeout-minutes: 10
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create multi-arch manifest
        shell: bash
        run: |
          set -euo pipefail
          tags="${{ needs.prepare.outputs.tags }}"
          images="${{ needs.prepare.outputs.images }}"
          if [ -z "$images" ]; then
            images="${REGISTRY}/${IMAGE_NAME}"
            images="${images}"$'\n'"${DOCKERHUB_REGISTRY}/${DOCKERHUB_IMAGE}"
          fi
          declare -A seen
          final_tags=""
          add_tag() {
            local t="$1"
            if [ -n "$t" ] && [ -z "${seen[$t]:-}" ]; then
              final_tags+="${t}"$'\n'
              seen["$t"]=1
            fi
          }
          while IFS= read -r tag; do
            add_tag "$tag"
          done <<< "$tags"
          while IFS= read -r image; do
            [ -z "$image" ] && continue
            add_tag "${image}:latest"
          done <<< "$images"
          if [ -z "$final_tags" ]; then
            echo "::error::No manifest tags produced; check prepare outputs."
            exit 1
          fi
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker buildx imagetools create -t "$tag" \
              "$tag-amd64-staging-${GITHUB_RUN_ID}" \
              "$tag-arm64-staging-${GITHUB_RUN_ID}"
          done <<< "$final_tags"
